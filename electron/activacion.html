<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>Activar Kiosco Domingo</title>
  <style>
    :root {
      --accent: #1b7a3a; --accent-hover: #14602d; --accent-dark: #13582a; --accent-soft: #e6f4ea;
      --bg: #f4f0e3; --surface: #ffffff; --border: #e2dac6;
      --text: #1d2a20; --muted: #5f6b62; --danger: #c0392b; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--accent);
      border-radius: var(--radius); box-shadow: 0 12px 40px rgba(29,42,32,.18);
      padding: 2rem; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 1rem;
    }
    img { width: 72px; height: 72px; border-radius: 50%; align-self: center; }
    h1 { font-size: 24px; text-align: center; color: var(--accent-dark); }
    p, li { font-size: 14px; color: var(--muted); line-height: 1.45; }
    ol { padding-left: 1.2rem; display: flex; flex-direction: column; gap: .25rem; }
    .codigo {
      display: flex; gap: .5rem; align-items: center; justify-content: space-between;
      background: var(--accent-soft); border-radius: 8px; padding: .75rem 1rem;
    }
    .codigo strong { font-family: Consolas, monospace; font-size: 20px; letter-spacing: 1px; color: var(--accent-dark); user-select: all; }
    label { font-size: 13px; font-weight: 600; }
    textarea {
      width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; word-break: break-all;
    }
    textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    button.secundario { background: var(--surface); color: var(--accent-dark); border: 1px solid var(--border); padding: 6px 12px; }
    .mensaje { font-size: 13px; min-height: 1em; color: var(--danger); }
    .mensaje.ok { color: var(--accent); }
  </style>
</head>
<body>
  <form class="card" id="form">
    <img src="../public/icon.png" alt="" />
    <h1>Activar Kiosco Domingo</h1>
    <ol>
      <li>Mandale este código a tu proveedor del sistema.</li>
      <li>Te va a responder con una clave de activación.</li>
      <li>Pegala abajo y tocá <strong>Activar</strong>. Se hace una sola vez.</li>
    </ol>
    <div class="codigo">
      <strong id="codigo">…</strong>
      <button type="button" class="secundario" id="copiar">Copiar</button>
    </div>
    <label for="clave">Clave de activación</label>
    <textarea id="clave" spellcheck="false" required></textarea>
    <div class="mensaje" id="mensaje" role="status"></div>
    <button type="submit" id="activar">Activar</button>
  </form>

  <script>
    const codigoEl  = document.getElementById('codigo');
    const mensajeEl = document.getElementById('mensaje');

    window.licencia.codigo()
      .then(c => { codigoEl.textContent = c; })
      .catch(() => { codigoEl.textContent = 'No disponible'; });

    document.getElementById('copiar').addEventListener('click', async () => {
      await window.licencia.copiar(codigoEl.textContent);
      mensajeEl.className = 'mensaje ok';
      mensajeEl.textContent = 'Código copiado.';
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('activar');
      btn.disabled = true;
      mensajeEl.className = 'mensaje';
      mensajeEl.textContent = '';
      const ok = await window.licencia.activar(document.getElementById('clave').value);
      if (ok) {
        mensajeEl.className = 'mensaje ok';
        mensajeEl.textContent = '¡Activado! Abriendo el sistema…';
      } else {
        mensajeEl.textContent = 'La clave no corresponde a este equipo. Revisá que esté completa.';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
